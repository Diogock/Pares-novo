[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-ibra"
version = "0.1.0"
description = "Pairs trading / arbitragem estatística em ações do IBRA (B3)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "arch>=6.2",
    "pydantic>=2.5",
    "pyarrow>=14",
    "PyYAML>=6",
    "openpyxl>=3.1",
    "exchange_calendars>=4.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "pandas-stubs", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "arch.*", "exchange_calendars.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
